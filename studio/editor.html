<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src __CSP__ 'unsafe-inline'; script-src 'nonce-__NONCE__'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="__STYLE__"><title>CommentInk</title></head><body>
<header><strong>CommentInk</strong><nav aria-label="绘图工具" id="tools">
<button data-tool="select" aria-pressed="true" title="拖动空白框选；Shift 点击多选">选择</button><button data-tool="pan" title="拖动画布；也可按住空格或使用鼠标中键">手形</button><button data-tool="box">方框</button><button data-tool="edge">连线</button><button data-tool="free" title="拖动绘制，端点自动吸附；Alt 保持自由端点">自由线</button><button data-tool="text">文字</button><button data-tool="formula">公式</button>
</nav><span class="separator"></span><button id="undo">撤销</button><button id="redo">重做</button><span class="spacer"></span><select id="copy-language" aria-label="复制注释语言"><option value="current">当前语言</option><option value="python">Python</option><option value="typescript">JS / TS</option></select><button id="copy">复制注释</button><button class="primary" id="apply">应用到注释</button></header>
<main id="diagram"><svg id="canvas" viewBox="0 0 1100 700" role="img" aria-label="图表画布，可选择并移动节点" tabindex="0"></svg><p id="empty">选择方框工具，拖出第一个节点。</p><div id="view-controls" aria-label="画布视图"><button id="zoom-out" aria-label="缩小画布">−</button><button id="zoom-reset" title="恢复默认视图">100%</button><button id="zoom-in" aria-label="放大画布">＋</button><button id="zoom-fit">适应内容</button></div><div id="selection-bar" hidden><span id="selection-count"></span><button id="duplicate">复制对象</button><button id="align-left">左对齐</button><button id="align-top">顶对齐</button><button id="delete-selection">删除</button></div><div id="collision-bar" hidden role="status"><span id="collision-count"></span><button id="arrange">避让重叠</button></div><section id="properties" hidden aria-label="选中对象属性"><label id="label-row"><span id="label-caption">文字</span> <input id="label" aria-label="对象文字" maxlength="120"></label><button id="edit-formula">编辑公式</button><label id="route-row" hidden>路径 <select id="edge-route"><option value="straight">折线</option><option value="orthogonal">直角避让</option></select></label><label id="arrow-row" hidden>箭头 <select id="edge-arrow"><option value="end">单向</option><option value="both">双向</option><option value="none">无</option></select></label><button id="clear-bends" hidden>清除转折点</button><button id="remove">删除对象</button></section></main>
<main id="math" hidden><img id="math-preview" alt="当前公式排版" hidden><p>点击下面的输入框，再选择模板；模板可以继续嵌套。</p></main>

<section id="formula-editor" hidden aria-label="公式模板编辑器">
<div class="template-bar"><strong>公式</strong><button data-template="fraction">分式</button><button data-template="sqrt">根号</button><button data-template="power">上标</button><button data-template="sum">求和</button><button data-template="integral">积分</button><button data-template="matrix">矩阵</button><button data-template="sequence">并列</button><button id="matrix-row" hidden>加一行</button><button id="matrix-col" hidden>加一列</button><span class="spacer"></span><button id="advanced">LaTeX</button><button id="close-formula">收起</button></div>
<div id="formula-fields"></div><textarea id="latex" aria-label="LaTeX 源码" spellcheck="false" hidden></textarea>
</section><footer><span id="hint">拖动节点后连线保持连接；双击节点编辑。</span><span id="status" role="status" aria-live="polite"></span></footer>
<script nonce="__NONCE__" src="__MODEL__"></script><script nonce="__NONCE__" src="__GEOMETRY__"></script><script nonce="__NONCE__" src="__SCRIPT__"></script></body></html>
